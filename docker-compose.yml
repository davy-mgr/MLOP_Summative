services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    cpus: "1.0"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://nginx:80
    ports:
      - "8501:8501"
    depends_on:
      - nginx
